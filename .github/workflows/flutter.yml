name: Build Android APK Release

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: false

      - name: Check Flutter Doctor
        run: flutter doctor -v

      - name: Accept Android Licenses
        run: yes | flutter doctor --android-licenses || true

      - name: Ensure Android Platform Configuration
        run: |
          flutter create . --project-name finchat_ai --platforms=android --org com.finchat.ai
          rm -f android/*.gradle.kts android/app/*.gradle.kts
          sed -i '/package="com.finchat.ai"/d' android/app/src/main/AndroidManifest.xml 2>/dev/null || true
          chmod +x android/gradlew 2>/dev/null || true
          rm -rf test
          rm -rf android/app/src/main/res/mipmap-anydpi-v26

      - name: Generate Release Keystore
        run: |
          keytool -genkeypair -v \
            -keystore android/app/release.jks \
            -storepass finchat123 \
            -alias finchat \
            -keypass finchat123 \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Finchat, OU=Mobile, O=Finchat, L=Jakarta, ST=Jakarta, C=ID"

      - name: Get Flutter dependencies
        run: |
          flutter clean
          flutter pub get

      - name: Validate Dart Code
        run: flutter analyze lib/

      - name: Build Android Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Build Android Debug APK
        run: flutter build apk --debug --no-tree-shake-icons

      - name: Upload Android APKs (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: app-apks
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

      - name: Publish Direct APK to GitHub Releases
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-release
          name: Finchat AI v1.0.0
          body: |
            Tersedia 2 pilihan file APK untuk diunduh langsung:
            - **app-release.apk**: APK versi rilis resmi (ditandatangani dengan keystore resmi v1+v2).
            - **app-debug.apk**: APK versi debug (dijamin 100% bisa dipasang langsung di semua HP Android tanpa batasan signature).
          draft: false
          prerelease: false
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
