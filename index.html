  <head>
    <meta charset="UTF-8" />

    <meta name="description" content="Aplikasi pencatatan keuangan pribadi cerdas dengan input teks/suara multi-transaksi, scan struk, Chat AI, laporan keuangan interaktif, dan sinkronisasi Google Sheets." />
    <meta name="theme-color" content="#059669" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Finchat AI" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta property="og:title" content="Finchat AI" />
    <meta property="og:description" content="Aplikasi pencatatan keuangan pribadi cerdas dengan input teks/suara multi-transaksi, scan struk, Chat AI, laporan keuangan interaktif, dan sinkronisasi Google Sheets." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      (function() {
        const isViteMessage = function(args) {
          try {
            for (let i = 0; i < args.length; i++) {
              const arg = args[i];
              const str = typeof arg === 'string' ? arg : (arg && arg.message ? String(arg.message) : '');
              if (str && (str.includes('[vite]') || str.includes('vite-plugin-pwa') || str.includes('failed to connect to websocket'))) {
                return true;
              }
            }
          } catch (e) {}
          return false;
        };

        ['error', 'warn', 'log', 'info', 'debug'].forEach(function(method) {
          const original = console[method];
          if (typeof original === 'function') {
            console[method] = function(...args) {
              if (isViteMessage(args)) return;
              original.apply(console, args);
            };
          }
        });

        window.addEventListener('error', function(event) {
          if (event && event.message && (event.message.includes('[vite]') || event.message.includes('failed to connect to websocket'))) {
            event.stopImmediatePropagation();
            event.preventDefault();
          }
        }, true);
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  </head>
  <body class="bg-slate-50 text-slate-900 font-sans antialiased select-none">

  </body>
